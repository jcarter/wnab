<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173c35" />
    <meta name="description" content="A private, read-only view across two YNAB plans." />
    <title>Together - Shared Budget View</title>
    <script>
      try {
        const theme = localStorage.getItem('ynabTogether.theme.v1');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Use the system theme when browser storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
